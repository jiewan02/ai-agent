<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02font.html</title>
    <style>
      .font-myem {
        font-size: 1em;
      }

      .font-myrem {
        font-size: 1rem;
      }

      .font-mypx {
        font-size: 8px;
      }

      .font-mypt {
        font-size: 12pt;
      }
    </style>
  </head>
  <body>
    <h2>02font.html</h2>
    <b> <mark> 1em = 1rem = 16px = 12pt 동일</mark></b>
    <ul>
      <li class="font-myem">font em 겨울왕국</li>
      <li class="font-myrem">font rem 겨울왕국</li>
      <li class="font-mypx">font px 겨울왕국</li>
      <li class="font-mypt">font pt 겨울왕국</li>
    </ul>

    <ul>
      <li style="font-size: 1em;">font em 겨울왕국</li>
      <li style="font-size: 1rem;">font rem 겨울왕국</li>
      <li style="font-size: 16px;">font px 겨울왕국</li>
      <li style="font-size: 12pt; ">font pt 겨울왕국</li>
    </ul>

    <br>
    
    <div style="font-size: 20pt;">
      <i>글꼴효과 i</i> <p></p>
      <em>글꼴효과 em</em> <p></p>
      <u>글꼴효과 u</u> <p></p>
      <ins>글꼴효과 ins</ins> <p></p>
      <del>글꼴효과 del</del> <p></p>
      <s>글꼴효과 s</s> <p></p>
      <b>bold</b>
    </div>
    

  </body>
</html>
